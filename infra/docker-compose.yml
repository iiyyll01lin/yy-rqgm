# AgentForge core stack (no ROCm required): Qdrant + FastAPI backend.
#
#   docker compose -f infra/docker-compose.yml up --build
#
# The backend runs fine with NO live model (deterministic inference mock) and,
# if Qdrant is down, degrades to an in-memory store. Point LEMONADE_BASE_URL at
# a real Lemonade server (Ryzen AI / Radeon) to use live inference.
services:
  qdrant:
    image: qdrant/qdrant
    container_name: agentforge-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agentforge-backend
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      # Reach a Lemonade server running on the host (optional; mock otherwise).
      - LEMONADE_BASE_URL=http://host.docker.internal:8020/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_storage:
